[project]
name = "legacy-roster"
description = "Roster updater for NHL Legacy Edition (PS3 / RPCS3)"
requires-python = ">=3.10"
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
gui = ["customtkinter>=6.0,<7"]     # the window only; the command line needs nothing

[project.scripts]
legacy-roster = "legacy_roster.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["legacy_roster", "legacy_roster.leagues"]

[tool.setuptools.package-data]
legacy_roster = ["data/*", "data/fonts/*"]

[tool.setuptools.dynamic]
version = { attr = "legacy_roster.__version__" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
