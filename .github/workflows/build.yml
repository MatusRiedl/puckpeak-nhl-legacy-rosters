# The tests on Linux and Windows. Started by hand from the Actions tab, or by pushing a tag v*. Nothing is built or
# attached here (since 0.80.1): the Windows exe is built on the owner's PC (packaging/build.ps1), the Linux program in a
# box (packaging/linux/build_in_docker.sh; MAINTAINING.md "The Linux program"), because the Linux program built here
# opened the classic window on players' PCs and nothing noticed. There is no Mac program since 0.80.1 (owner).
# The base roster is not in git, so the tests that need it are skipped here; the others run.
name: tests

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest pillow
      - run: python -m pytest -q -p no:cacheprovider
